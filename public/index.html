<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="أهداف" />
  <meta name="theme-color" content="#F4F1EB" />
  <meta name="description" content="نتائج ومواعيد المباريات في جميع الدوريات والكؤوس" />
  <title>أهداف</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="stage">
    <div class="phone" id="app">
      <div id="splash" class="splash">
        <img src="/icons/icon-256.png" alt="" class="splash-icon" />
        <h1>أهداف</h1>
        <p>نتائج هادئة · كل الدوريات</p>
      </div>

      <header class="topbar" id="topbar">
        <button class="icon-btn hidden" id="backBtn" aria-label="رجوع">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="topbar-text">
          <div class="eyebrow" id="eyebrow">أهداف</div>
          <h1 id="pageTitle">المباريات</h1>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="searchBtn" aria-label="بحث">
            <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="11" cy="11" r="6.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M16 16l4 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
          <button class="icon-btn" id="moreBtn" aria-label="المزيد">
            <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="6" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="18" cy="12" r="1.4" fill="currentColor"/></svg>
          </button>
        </div>
      </header>

      <div class="search-wrap hidden" id="searchWrap">
        <input id="searchInput" type="search" placeholder="ابحث عن فريق أو دوري…" autocomplete="off" />
      </div>

      <div class="dates" id="dates"></div>
      <div class="chips" id="chips"></div>

      <main class="view" id="view"></main>

      <nav class="tabbar" id="tabbar">
        <button data-tab="matches" class="tab on">
          <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 3v4M16 3v4M4 10h16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <span>المباريات</span>
        </button>
        <button data-tab="live" class="tab">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/></svg>
          <i class="dot" id="liveDot"></i>
          <span>مباشر</span>
        </button>
        <button data-tab="leagues" class="tab">
          <svg viewBox="0 0 24 24"><path d="M6 16.5l6-10 6 10H6z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8.5 16.5l3.5-6 3.5 6" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
          <span>الدوريات</span>
        </button>
        <button data-tab="favorites" class="tab">
          <svg viewBox="0 0 24 24"><path d="M12 18.2l-5.4 2.6 1.2-5.9L3.5 10.8l6-.8L12 4.6l2.5 5.4 6 .8-4.3 4.1 1.2 5.9z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          <span>المفضلة</span>
        </button>
      </nav>
    </div>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
