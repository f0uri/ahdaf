<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="أهداف" />
  <meta name="theme-color" content="#0B0F12" />
  <meta name="description" content="نتائج ومواعيد المباريات في جميع الدوريات والكؤوس" />
  <title>أهداف</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="stage">
    <div class="phone" id="app">
      <div id="toast" class="toast" role="status"></div>

      <header class="topbar" id="topbar">
        <button class="icon-btn hidden" id="backBtn" aria-label="رجوع">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="topbar-text">
          <div class="eyebrow" id="eyebrow">أهداف</div>
          <h1 id="pageTitle">المباريات</h1>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="searchBtn" aria-label="بحث">
            <svg viewBox="0 0 24 24" width="17" height="17"><circle cx="11" cy="11" r="6.1" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M16.2 16.2L21 21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
          </button>
          <button class="icon-btn" id="moreBtn" aria-label="المزيد">
            <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="5.5" cy="12" r="1.55" fill="currentColor"/><circle cx="12" cy="12" r="1.55" fill="currentColor"/><circle cx="18.5" cy="12" r="1.55" fill="currentColor"/></svg>
          </button>
        </div>
      </header>

      <div class="search-wrap hidden" id="searchWrap">
        <label class="search-field">
          <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="searchInput" type="search" placeholder="ابحث عن فريق أو دوري" autocomplete="off" enterkeyhint="search" />
        </label>
      </div>

      <div class="dates" id="dates"></div>
      <div class="chips" id="chips"></div>

      <main class="view" id="view"></main>

      <nav class="tabbar" id="tabbar">
        <button data-tab="matches" class="tab on">
          <svg viewBox="0 0 24 24"><rect x="4.2" y="5.2" width="15.6" height="14.4" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 3.6v3.4M16 3.6v3.4M4.2 10h15.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>المباريات</span>
        </button>
        <button data-tab="live" class="tab">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.1" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.35" fill="currentColor"/></svg>
          <i class="dot" id="liveDot"></i>
          <span>مباشر</span>
        </button>
        <button data-tab="leagues" class="tab">
          <svg viewBox="0 0 24 24"><path d="M12 4.4l7.2 14.4H4.8L12 4.4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.7 16.4l3.3-6.6 3.3 6.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <span>الدوريات</span>
        </button>
        <button data-tab="more" class="tab">
          <svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="18.5" cy="12" r="1.6" fill="currentColor"/></svg>
          <span>المزيد</span>
        </button>
      </nav>
    </div>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
