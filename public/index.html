<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="أهداف" />
  <meta name="theme-color" content="#0B0F12" />
  <meta name="description" content="نتائج ومواعيد المباريات في جميع الدوريات والكؤوس" />
  <title>أهداف</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css?v=31" />
</head>
<body>
  <div class="stage">
    <div class="phone" id="app">
      <div id="toast" class="toast" role="status"></div>
      <input id="photoInput" class="hidden" type="file" accept="image/*" />

      <div id="authLayer" class="auth-layer hidden">
        <div class="auth-bg" aria-hidden="true"></div>
        <div class="auth-sheet">
          <img class="auth-logo" src="/icons/icon-192.png" alt="" />
          <div class="auth-brand">أهداف</div>
          <p class="auth-lead" id="authLead">مباشر، نتائج، ومواعيدك في مكان واحد</p>
          <button type="button" class="auth-google" id="authGoogle">
            <span class="g-logo" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="22" height="22"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09A6.97 6.97 0 0 1 5.48 12c0-.72.12-1.43.36-2.09V7.07H2.18A10.96 10.96 0 0 0 1 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            </span>
            <span id="authGoogleLabel">المتابعة بحساب Google</span>
          </button>
          <button type="button" class="auth-guest" id="authGuest">الدخول كزائر</button>
          <div id="authAccounts" class="auth-accounts"></div>
          <p class="auth-note" id="authNote">حساب Google يحفظ فرقك على جيميلك. الزائر يبقى على هذا الهاتف فقط.</p>
        </div>
      </div>

      <div id="handleLayer" class="auth-layer hidden">
        <div class="auth-bg" aria-hidden="true"></div>
        <div class="auth-sheet">
          <div class="auth-brand" style="font-size:28px">أكمل حسابك</div>
          <p class="auth-lead" id="handleLead">اليوزر ثابت ولا يمكن تغييره لاحقاً</p>
          <label class="auth-field">
            <span class="field-lab" id="handleLab">اليوزر</span>
            <input id="handleUser" type="text" maxlength="20" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="" />
          </label>
          <label class="auth-field">
            <span class="field-lab" id="nameLab">الاسم</span>
            <input id="handleName" type="text" maxlength="24" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="" />
          </label>
          <p class="field-err hidden" id="handleErr"></p>
          <button type="button" class="auth-create" id="handleSave">متابعة</button>
        </div>
      </div>

      <div id="dhikrLayer" class="dhikr-layer hidden">
        <div class="dhikr-card" role="dialog" aria-modal="true">
          <div class="dhikr-kicker" id="dhikrKicker">ذكر</div>
          <div class="dhikr-phrase" id="dhikrPhrase"></div>
          <button type="button" class="dhikr-ameen" id="dhikrAmeen">آمين</button>
        </div>
      </div>

      <div class="float-name" id="userLine">
        <span id="userLineAva" class="userline-ava"></span>
        <b id="userLineName"></b>
        <span class="userline-badge" id="userLineBadge"></span>
      </div>
      <header class="topbar" id="topbar">
        <button class="icon-btn hidden" id="backBtn" aria-label="رجوع">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="topbar-text">
          <div class="eyebrow hidden" id="eyebrow">أهداف</div>
          <h1 id="pageTitle">المباريات</h1>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="searchBtn" aria-label="بحث">
            <svg viewBox="0 0 24 24" width="17" height="17"><circle cx="11" cy="11" r="6.1" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M16.2 16.2L21 21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
          </button>
        </div>
      </header>

      <div class="search-wrap hidden" id="searchWrap">
        <label class="search-field">
          <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="searchInput" type="search" placeholder="ابحث عن فريق أو دوري" autocomplete="off" enterkeyhint="search" />
        </label>
      </div>

      <div class="dates" id="dates"></div>
      <div class="chips" id="chips"></div>

      <main class="view" id="view"></main>

      <nav class="tabbar" id="tabbar">
        <button data-tab="matches" class="tab on">
          <svg viewBox="0 0 24 24"><rect x="4.2" y="5.2" width="15.6" height="14.4" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 3.6v3.4M16 3.6v3.4M4.2 10h15.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>المباريات</span>
        </button>
        <button data-tab="live" class="tab">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.1" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.35" fill="currentColor"/></svg>
          <i class="dot" id="liveDot"></i>
          <span>مباشر</span>
        </button>
        <button data-tab="leagues" class="tab">
          <svg viewBox="0 0 24 24"><path d="M12 4.4l7.2 14.4H4.8L12 4.4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.7 16.4l3.3-6.6 3.3 6.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <span>الدوريات</span>
        </button>
        <button data-tab="more" class="tab">
          <svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="18.5" cy="12" r="1.6" fill="currentColor"/></svg>
          <span>المزيد</span>
        </button>
      </nav>
    </div>
  </div>
  <script src="/js/google-config.js"></script>
  <script src="/js/secure.js?v=28"></script>
  <script src="/js/google-sync.js?v=27"></script>
  <script src="/js/app.js?v=31"></script>
</body>
</html>
