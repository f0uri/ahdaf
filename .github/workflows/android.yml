name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Add Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android app and icons
        run: |
          pip install --quiet pillow
          python3 scripts/make-android-icons.py
          python3 scripts/configure-android.py

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/ahdaf.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: أهداف v${{ github.run_number }}
          files: dist/ahdaf.apk
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            تطبيق أهداف — نتائج ومواعيد المباريات
            تنزيل مباشر: ahdaf.apk
