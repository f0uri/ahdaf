name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Add Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android app and icons
        run: |
          pip install --quiet pillow
          python3 scripts/make-android-icons.py
          python3 << 'PY'
          from pathlib import Path
          strings = Path("android/app/src/main/res/values/strings.xml")
          if strings.exists():
              s = strings.read_text()
              s = s.replace(">Ahdaf<", ">أهداف<").replace(">ahdaf<", ">أهداف<")
              cfg = Path("public/js/google-config.js").read_text()
              import re
              m = re.search(r'webClientId:\s*"([^"]*)"', cfg)
              cid = m.group(1) if m else ""
              if cid and "<string name=\"server_client_id\"" not in s:
                  s = s.replace("</resources>", f'    <string name="server_client_id">{cid}</string>\n</resources>')
              strings.write_text(s)
          styles = Path("android/app/src/main/res/values/styles.xml")
          if styles.exists():
              t = styles.read_text()
              if "windowDisablePreview" not in t:
                  t = t.replace(
                      "</style>",
                      "        <item name=\"android:windowDisablePreview\">true</item>\n    </style>",
                      1,
                  )
              styles.write_text(t)
          man = Path("android/app/src/main/AndroidManifest.xml")
          if man.exists():
              m = man.read_text()
              filt = '''
              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="app.ahdaf.scores" android:host="oauth" />
              </intent-filter>'''
              if "app.ahdaf.scores" not in m:
                  m = m.replace("</activity>", filt + "\n        </activity>", 1)
                  man.write_text(m)
          gradle = Path("android/app/build.gradle")
          if gradle.exists():
              g = gradle.read_text()
              if "ahdaf-debug.keystore" not in g:
                  g = g.replace(
                      "android {",
                      '''android {
      signingConfigs {
          debug {
              storeFile file("../../signing/ahdaf-debug.keystore")
              storePassword "android"
              keyAlias "androiddebugkey"
              keyPassword "android"
          }
      }''',
                      1,
                  )
                  gradle.write_text(g)
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/ahdaf.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: أهداف v${{ github.run_number }}
          files: dist/ahdaf.apk
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            تطبيق أهداف — نتائج ومواعيد المباريات
            تنزيل مباشر: ahdaf.apk
